[workspace]
resolver = "2"
members = [
    "crates/needle-core",
    "crates/needle-runtime",
    "crates/needle-platform-codex",
    "crates/needle-bench",
    "crates/needle-app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
arrayvec = { version = "0.7.6", features = ["serde"] }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1.3"
