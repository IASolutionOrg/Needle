[package]
name = "needle-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "needle"
path = "src/main.rs"

[dependencies]
axum = "0.8"
blake3.workspace = true
dialoguer = { version = "0.12", default-features = false }
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
mime_guess = "2"
needle-bench = { path = "../needle-bench" }
needle-core = { path = "../needle-core" }
needle-platform-codex = { path = "../needle-platform-codex" }
needle-runtime = { path = "../needle-runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
rust-embed = "8"

[dev-dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
tower = "0.5"
